name: Local VM Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted  # Run inside your VM

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deployment commands
        run: |
          echo "Running inside the VM..."
          pwd
          ls -la

          # You don't need to cd manually; you're already in the repo folder.
          # But if you want to confirm:
          cd /home/admin/_work/simpleapp2/simpleapp2

          git checkout master
          git pull

          # Example deployment steps
          # npm install
          # npm run build
          # systemctl restart myapp
